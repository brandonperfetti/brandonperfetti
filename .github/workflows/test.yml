name: Test

# The generator's unit tests, on every pull request and on pushes to the base
# branches, so the README workflow is exercised before it runs on a schedule.

on:
  pull_request:
  push:
    branches: [develop, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - run: node --check index.js
      - run: node --test
