name: Regenerate README

# README.template.md is the source; index.js fills its placeholders (GitHub
# stats rendered to two SVGs under assets/, latest articles, last shipped) and
# writes README.md. This runs daily on the default branch and commits only when
# the output changed. The commit is authored as Brandon with no trailer.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regenerate-readme-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out ${{ github.ref_name }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Test the generator
        run: node --test

      - name: Generate README.md and the stats SVGs
        run: node index.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit when the output changed
        run: |
          git add README.md assets/github-stats-light.svg assets/github-stats-dark.svg
          if git diff --cached --quiet; then
            echo "Generated output is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "Brandon Perfetti"
          git config user.email "2780463+brandonperfetti@users.noreply.github.com"
          git commit -m "chore: regenerate README"
          git push origin "HEAD:${GITHUB_REF_NAME}"
